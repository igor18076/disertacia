[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = standard

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = standard

[formatter_standard]
format = %(levelname)s [%(name)s] %(message)s
