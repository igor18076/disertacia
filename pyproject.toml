[project]
name = "coursegen"
version = "0.1.0"
description = "Исследовательская система генерации учебных материалов"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "qdrant-client==1.20.0",
    "sqlalchemy==2.1.9",
    "uvicorn==0.54.0",
]

[dependency-groups]
test = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
]

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
